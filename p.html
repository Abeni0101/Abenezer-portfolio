<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
        }

        .app-container {
            width: 1400px;
            max-width: 95vw;
            height: 850px;
            max-height: 95vh;
            background: #050505; /* Solid dark base */
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* --- NEW: Hero Animal Image Styling --- */
        .hero-animal {
            position: absolute;
            top: 50%;
            left: 55%;
            transform: translate(-50%, -50%);
            width: 800px; /* Adjust size based on your image */
            height: auto;
            z-index: 1; /* Keep it behind text */
            pointer-events: none; /* Prevent image dragging */
            /* This mask makes the edges of the image fade smoothly into the black background */
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 70%);
            mask-image: radial-gradient(circle at center, black 30%, transparent 70%);
        }
        /* -------------------------------------- */

        /* To keep the ambient warm glow behind the animal */
        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 55%;
            transform: translate(-50%, -50%);
            width: 900px;
            height: 900px;
            background: radial-gradient(circle, rgba(255, 69, 0, 0.15) 0%, rgba(0,0,0,0) 60%);
            z-index: 0;
            pointer-events: none;
        }

        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 40px 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #ff7b00, #ff4500);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(255, 69, 0, 0.3);
        }

        .logo-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 28px;
            color: #ffffff;
            letter-spacing: -1px;
        }

        nav {
            display: flex;
            gap: 40px;
            margin-left: 30px;
        }

        nav a {
            color: #e0e0e0;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #ff4500;
        }

        .btn-download {
            background: linear-gradient(90deg, #ff4500, #ff6a00);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.5px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 69, 0, 0.6);
        }

        .social-sidebar {
            position: absolute;
            left: 80px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 35px;
            z-index: 10;
        }

        .social-sidebar i {
            color: #f0f0f0;
            font-size: 22px;
            cursor: pointer;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .social-sidebar i:hover {
            color: #ff4500;
            transform: scale(1.1);
        }

        .hero-content {
            position: absolute;
            bottom: 80px;
            left: 180px;
            z-index: 10;
        }

        .intro-label {
            color: #ff5722;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 20px;
            letter-spacing: 2.5px;
            margin-bottom: 5px;
        }

        .brand-title {
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 130px;
            line-height: 0.9;
            letter-spacing: -5px;
            margin-left: -7px;
            margin-bottom: 10px;
        }

        .tagline {
            color: #8c8886;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
        }

        .description {
            color: #888888;
            font-size: 14px;
            line-height: 1.6;
            max-width: 450px;
            font-weight: 400;
        }

        .features-sidebar {
            position: absolute;
            right: 80px;
            top: 48%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 22px;
            z-index: 10;
        }

        .feature-item {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 18px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .feature-item:hover {
            transform: translateX(-5px);
        }

        .feature-item span {
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .feature-icon-box {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #ff6a00, #ff3b00);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 20px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.3), 0 4px 15px rgba(255, 77, 0, 0.4);
        }

        .feature-item.dimmed span {
            color: #4a4a4a;
        }

        .feature-item.dimmed .feature-icon-box {
            background: linear-gradient(135deg, #2d1f1a, #1a100c);
            color: #7a4f3b;
            box-shadow: none;
            border: 1px solid #3d261b;
        }

        .google-play-badge {
            position: absolute;
            bottom: 70px;
            right: 80px;
            background-color: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: background 0.3s ease, border-color 0.3s ease;
            z-index: 10;
        }

        .google-play-badge:hover {
            background-color: #252525;
            border-color: #555555;
        }

        .play-icon img {
            width: 26px;
            height: 26px;
        }

        .play-text-col {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .play-text-small {
            color: #aaaaaa;
            font-size: 10px;
            line-height: 1;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .play-text-large {
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 16px;
            line-height: 1;
            letter-spacing: -0.3px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Ambient Background Glow -->
        <div class="ambient-glow"></div>

        <!-- REPLACE "lion-glow.png" WITH YOUR GENERATED IMAGE URL/PATH -->
        <img src="1.png" alt="Majestic Lion" class="hero-animal">
        
        <!-- Header / Navigation -->
        <header>
            <div class="brand-logo">
                <div class="logo-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
                        <path d="M20.2,7.8l-3.2,1.8c-1.2-2.3-3.7-3.8-6.5-3.8C6.4,5.8,3,9.2,3,13.5S6.4,21.2,10.5,21.2 c2.9,0,5.4-1.6,6.6-4l3.1,1.9c-1.8,3.3-5.3,5.6-9.7,5.6C4.7,24.7,0,20,0,14.2S4.7,3.7,10.5,3.7C15.1,3.7,18.5,5.1,20.2,7.8z"/>
                    </svg>
                </div>
                <span class="logo-text">castro</span>
            </div>
            <nav>
                <a href="#">About Browser</a>
                <a href="#">Features</a>
                <a href="#">Whitepaper</a>
                <a href="#">Tokenomics</a>
                <a href="#">Roadmap</a>
            </nav>
            <button class="btn-download">DOWNLOAD</button>
        </header>

        <!-- Social Links Sidebar -->
        <div class="social-sidebar">
            <i class="fa-brands fa-google-play"></i>
            <i class="fa-brands fa-twitter"></i>
            <i class="fa-brands fa-github"></i>
            <i class="fa-brands fa-youtube"></i>
        </div>

        <!-- Main Hero Text Section -->
        <div class="hero-content">
            <h4 class="intro-label">INTRODUCING</h4>
            <h1 class="brand-title">castro</h1>
            <h3 class="tagline">THE FASTEST WEB 3.0 BROWSER</h3>
            <p class="description">
                Decentralized browser with AdBlock, VPN, Crypto Wallet, 100%<br>
                Privacy and many other features that you can use now!
            </p>
        </div>

        <!-- App Features Menu -->
        <div class="features-sidebar">
            <div class="feature-item">
                <span>BROWSER</span>
                <div class="feature-icon-box"><i class="fa-solid fa-earth-americas"></i></div>
            </div>
            <div class="feature-item">
                <span>VPN</span>
                <div class="feature-icon-box"><i class="fa-solid fa-shield-halved"></i></div>
            </div>
            <div class="feature-item">
                <span>WALLET</span>
                <div class="feature-icon-box"><i class="fa-solid fa-box-archive"></i></div>
            </div>
            <div class="feature-item">
                <span>STAKING</span>
                <div class="feature-icon-box"><i class="fa-solid fa-layer-group"></i></div>
            </div>
            <div class="feature-item dimmed">
                <span>SWAP</span>
                <div class="feature-icon-box"><i class="fa-solid fa-arrows-rotate"></i></div>
            </div>
            <div class="feature-item dimmed">
                <span>BRIDGE</span>
                <div class="feature-icon-box"><i class="fa-solid fa-link"></i></div>
            </div>
        </div>

        <!-- Google Play Store Button -->
        <div class="google-play-badge">
            <div class="play-icon">
                <img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/Google_Play_Arrow_logo.svg" alt="Google Play Icon">
            </div>
            <div class="play-text-col">
                <span class="play-text-small">GET IT ON</span>
                <span class="play-text-large">Google Play</span>
            </div>
        </div>

    </div>

</body>
</html>
